  $('#vok').onclick=()=>{VT.desde=$('#vd').value||hoy();VT.hasta=$('#vh').value||hoy();R.ventas()};
  document.querySelectorAll('[data-v]').forEach(t=>t.onclick=async()=>{const v=rows.find(x=>x.id===t.dataset.v);const its=await get('venta_items?select=*&venta_id=eq.'+v.id);
    const mo=modal('<h2>Venta #'+v.numero+'</h2><p class="hint">'+fdt(v.fecha)+' · '+(MODOS[v.modo]||v.modo)+(v.mesa_numero?' · Mesa '+v.mesa_numero:'')+'</p>'+tabla(['Producto','Cant.','Importe'],its.map(i=>[i.descripcion,fnum(i.cantidad,0),money(i.subtotal)]),[1,2])+'<div class="trow"><span>Subtotal</span><span>'+money(v.subtotal)+'</span></div>'+(Number(v.descuento)?'<div class="trow"><span>Descuento</span><span>−'+money(v.descuento)+'</span></div>':'')+(Number(v.propina)?'<div class="trow"><span>Propina</span><span>'+money(v.propina)+'</span></div>':'')+'<div class="ttl"><span>Total</span><span>'+money(v.total)+'</span></div><div class="mfoot"><button class="btn l" id="pt">🖨️ Ticket</button>'+(esAdm()&&v.estado==='confirmada'?'<button class="btn r" id="an">Anular venta</button>':'')+'</div>');
    $('#pt',mo).onclick=()=>ventana('Ticket','<h2>'+esc(S.negocio.nombre)+'</h2><div style="text-align:center">'+(S.negocio.direccion?esc(S.negocio.direccion)+'<br>':'')+'Venta #'+v.numero+' · '+fdt(v.fecha)+'</div><hr><table>'+its.map(i=>'<tr><td>'+fnum(i.cantidad,0)+' × '+esc(i.descripcion)+'</td><td class="n">'+money(i.subtotal)+'</td></tr>').join('')+'</table><hr><table>'+(Number(v.descuento)?'<tr><td>Descuento</td><td class="n">−'+money(v.descuento)+'</td></tr>':'')+(Number(v.propina)?'<tr><td>Propina</td><td class="n">'+money(v.propina)+'</td></tr>':'')+'<tr><td><b>TOTAL</b></td><td class="n"><b>'+money(v.total)+'</b></td></tr></table><p style="text-align:center">Gracias por tu visita<br>Ticket no válido como factura</p>');
    if($('#an',mo))$('#an',mo).onclick=()=>{const m2=modal('<h2>Anular venta #'+v.numero+'</h2><p class="hint">Se devuelve el stock y se descuenta de la caja.</p><div class="fg"><label>Motivo</label><input id="mt"></div><div class="mfoot"><button class="btn r" id="ok">Anular</button></div>');$('#ok',m2).onclick=e=>busy(e.target,async()=>{await rpc('anular_venta',{p_venta:v.id,p_motivo:$('#mt',m2).value||'Sin motivo'});m2.close();mo.close();toast('Venta anulada','ok');R.ventas()})}})};

/* ---------- CONFIGURACIÓN ---------- */
let CF={tab:'negocio'};
R.config=async function(){
  main('<div class="tabs2">'+[['negocio','Negocio'],['categorias','Categorías'],['proveedores','Proveedores'],['usuarios','Usuarios']].map(t=>'<button data-t="'+t[0]+'" class="'+(CF.tab===t[0]?'act':'')+'">'+t[1]+'</button>').join('')+'</div><div id="cfb"></div>');
  document.querySelectorAll('.tabs2 [data-t]').forEach(b=>b.onclick=()=>{CF.tab=b.dataset.t;R.config()});
  const n=S.negocio;
  if(CF.tab==='negocio'){
    $('#cfb').innerHTML=ayuda('Datos del local','<ul><li>Completá el nombre, la dirección y el teléfono: salen en los tickets.</li><li>Las mesas y los salones no se configuran acá: se arman en <b>Salón → Editar mapa</b> (botón de abajo).</li></ul>')+'<div class="panel"><div class="ptit">Datos del local</div><div class="fgrid">'+[['nombre','Nombre'],['slogan','Slogan'],['cuit','CUIT'],['condicion_iva','Condición IVA'],['direccion','Dirección'],['telefono','Teléfono'],['email','Email']].map(f=>'<div class="fg"><label>'+f[1]+'</label><input data-k="'+f[0]+'" value="'+esc(n[f[0]]||'')+'"></div>').join('')+'</div><button class="btn o" id="gn">Guardar</button> <button class="btn l" id="gm">Ir al mapa del salón</button><p class="hint" style="margin-top:10px">Las mesas se configuran en el Salón con el botón “Editar mapa”.</p></div>';
    $('#gm').onclick=()=>{SAL.edit=true;go('salon')};
    $('#gn').onclick=e=>busy(e.target,async()=>{const p={};document.querySelectorAll('#cfb [data-k]').forEach(i=>p[i.dataset.k]=i.value.trim()||null);await rpc('guardar_negocio',{p});Object.assign(S.negocio,p);$('#hneg').textContent=S.negocio.nombre;try{sessionStorage.setItem('mgg',JSON.stringify(S))}catch(x){}toast('Guardado','ok')})}
  else if(CF.tab==='categorias'){
    await simpleCrud({t:'categorias',title:'',order:'orden,nombre',del:true,q:'',into:'#cfb',ayuda:['Categorías','<ul><li>Son los grupos del menú (hamburguesas, bebidas, postres…). Aparecen como botones al tomar un pedido.</li><li>El <b>orden</b> define cuál se ve primero (0 va primero).</li></ul>'],cols:[['Nombre',r=>r.nombre],['Orden',r=>r.orden]],fields:[{k:'nombre',l:'Nombre',req:1},{k:'orden',l:'Orden',type:'number',def:0}],after:()=>{C={}}},R.config)}
  else if(CF.tab==='proveedores'){
    await simpleCrud({t:'proveedores',title:'',order:'nombre',del:true,soft:true,q:'',into:'#cfb',ayuda:['Proveedores','<ul><li>Cargá a quienes te venden mercadería. Los elegís al <b>registrar una compra</b> en Insumos y stock.</li><li>Si ya tiene compras, no se puede borrar: queda inactivo.</li></ul>'],cols:[['Nombre',r=>r.nombre],['Contacto',r=>r.contacto||''],['Teléfono',r=>r.telefono||'']],fields:[{k:'nombre',l:'Nombre',req:1},{k:'cuit',l:'CUIT'},{k:'contacto',l:'Contacto'},{k:'telefono',l:'Teléfono'},{k:'email',l:'Email'},{k:'notas',l:'Notas',type:'area',w:'wf'}]},R.config)}
  else usuariosTab()};
async function fnUsuarios(body){
  const r=await fetch(SB+'/functions/v1/usuarios-gastronomia',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+S.token},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
async function usuariosTab(){
  const rows=await get('usuarios?select=id,nombre,username,rol,activo&order=nombre');
  $('#cfb').innerHTML=ayuda('Usuarios y roles','<ul><li><b>admin</b>: todo. <b>cajero</b>: salón, cobros, caja y ventas. <b>mozo</b>: toma pedidos en el salón. <b>cocina</b>: pantalla de cocina, stock y desperdicios.</li><li>Cada persona tiene su usuario para saber quién hizo qué.</li></ul>')+'<div class="brow"><span class="sp"></span><button class="btn o" id="un">+ Nuevo usuario</button></div>'+tabla(['Nombre','Usuario','Rol','Estado',''],rows.map(r=>[r.nombre,r.username,r.rol,r.activo?'Activo':'Inactivo','<!><button class="btn sm l" data-e="'+r.id+'">Editar</button> <button class="btn sm l" data-k="'+r.id+'">Clave</button>']));
  const ROLES=['admin','cajero','mozo','cocina'];
  $('#un').onclick=()=>{const mo=modal('<h2>Nuevo usuario</h2><div class="fgrid"><div class="fg"><label>Nombre</label><input id="a1"></div><div class="fg"><label>Usuario</label><input id="a2" autocapitalize="off"></div><div class="fg"><label>Contraseña (mín. 8)</label><input id="a3" type="text"></div><div class="fg"><label>Rol</label><select id="a4">'+ROLES.map(r=>'<option'+(r==='mozo'?' selected':'')+'>'+r+'</option>').join('')+'</select></div></div><div class="mfoot"><button class="btn o" id="ok">Crear</button></div>');$('#ok',mo).onclick=e=>busy(e.target,async()=>{await fnUsuarios({accion:'crear',nombre:$('#a1',mo).value,username:$('#a2',mo).value,password:$('#a3',mo).value,rol:$('#a4',mo).value});mo.close();toast('Usuario creado','ok');usuariosTab()})};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.e);const mo=modal('<h2>'+esc(r.username)+'</h2><div class="fgrid"><div class="fg"><label>Nombre</label><input id="a1" value="'+esc(r.nombre)+'"></div><div class="fg"><label>Rol</label><select id="a4">'+ROLES.map(x=>'<option'+(r.rol===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="fg"><label>Estado</label><select id="a5"><option value="true">Activo</option><option value="false"'+(!r.activo?' selected':'')+'>Inactivo</option></select></div></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');$('#ok',mo).onclick=e=>busy(e.target,async()=>{await fnUsuarios({accion:'editar',id:r.id,nombre:$('#a1',mo).value,rol:$('#a4',mo).value,activo:$('#a5',mo).value==='true'});mo.close();usuariosTab()})});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.k);const mo=modal('<h2>Nueva clave para '+esc(r.username)+'</h2><div class="fg"><label>Contraseña (mín. 8)</label><input id="a3"></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');$('#ok',mo).onclick=e=>busy(e.target,async()=>{await fnUsuarios({accion:'clave',id:r.id,password:$('#a3',mo).value});mo.close();toast('Clave actualizada','ok')})})}
function miClave(){
  const mo=modal('<h2>Cambiar mi contraseña</h2><div class="fgrid"><div class="fg"><label>Actual</label><input id="c1" type="password"></div><div class="fg"><label>Nueva (mín. 8)</label><input id="c2" type="password"></div></div><div class="mfoot"><button class="btn o" id="ok">Cambiar</button></div>');
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{await fnUsuarios({accion:'mi_clave',actual:$('#c1',mo).value,nueva:$('#c2',mo).value});mo.close();toast('Contraseña cambiada','ok')})}

/* ---------- INICIO ---------- */
(function(){
  const k=document.createElement('button');k.className='btn l sm';k.textContent='🔑';k.title='Cambiar mi contraseña';k.onclick=()=>{if(esDemo())toast('En la demo no se puede cambiar la contraseña','err');else miClave()};
  $('#hout').before(k);
  $('#hout').onclick=salirClick;
  $('#hmenu').onclick=()=>$('#app').classList.toggle('nav-open');
  $('#nbk').onclick=()=>$('#app').classList.remove('nav-open');
  $('#lform').onsubmit=async e=>{e.preventDefault();const b=$('#lbtn');b.disabled=true;$('#lerr').classList.add('hidden');try{await login({username:$('#lu').value.trim(),password:$('#lp').value})}catch(er){$('#lerr').textContent=er.message;$('#lerr').classList.remove('hidden')}finally{b.disabled=false}};
  $('#ldemo').onclick=async e=>{e.target.disabled=true;e.target.textContent='Preparando la demo…';$('#lerr').classList.add('hidden');try{await login({demo:true})}catch(er){$('#lerr').textContent=er.message;$('#lerr').classList.remove('hidden')}finally{e.target.disabled=false;e.target.textContent='Probar una demo sin registrarme'}};
  let ses=null;try{ses=JSON.parse(sessionStorage.getItem('mgg')||'null')}catch(e){}
  if(new URLSearchParams(location.search).has('demo')){$('#loading').classList.add('hidden');login({demo:true}).catch(er=>{$('#login').classList.remove('hidden');$('#lerr').textContent=er.message;$('#lerr').classList.remove('hidden')})}
  else if(ses&&ses.token){S=ses;start()}else{$('#loading').classList.add('hidden');$('#login').classList.remove('hidden')}
})();
</script>
