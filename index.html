<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Gestor Gastronomía — Sistema para restaurantes, pizzerías y sandwicherías</title>
<meta name="description" content="Salón con mapa de mesas, comandas, recetas con control de stock por ingrediente, desperdicios y caja para locales gastronómicos.">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1a17;--brown:#3b2a20;--brown2:#523a2c;--acc:#d9381e;--acc2:#f59e0b;--bg:#f8f5f0;--card:#fff;--line:#e8e2da;--mut:#6b6259;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--r:12px;--rs:8px;--sh:0 2px 10px rgba(31,26,23,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Barlow,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.4}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.2px}
header.top{background:var(--brown);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;height:58px;position:sticky;top:0;z-index:50;border-bottom:4px solid var(--acc)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;white-space:nowrap}
.brand b{color:var(--acc2)}
.hinfo{display:flex;align-items:center;gap:10px;font-size:13px;color:#f1e9e1;min-width:0}
.hinfo .neg{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.pill.demo{background:var(--acc2);color:#422006}
.pill.rol{background:#ffffff22;color:#fff}
nav#nav{background:var(--brown);position:fixed;top:58px;left:0;bottom:0;width:208px;display:flex;flex-direction:column;gap:2px;padding:12px 8px;overflow-y:auto;z-index:45}
.tab{border:0;background:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;color:#e6d9cc;border-left:4px solid transparent;border-radius:6px;text-align:left;width:100%}
.tab .ti{font-size:19px;line-height:1;width:24px;text-align:center}
.tab:hover{color:#fff;background:var(--brown2)}
.tab.act{color:#fff;background:var(--brown2);border-left-color:var(--acc)}
#hmenu{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 6px;line-height:1}
#nbk{display:none}
main#main{padding:20px;max-width:1500px;margin:0 0 0 208px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.ptit{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptit .sp,.sp{flex:1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.scard{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:5px solid var(--brown2)}
.scard.o{border-left-color:var(--acc)}.scard.g{border-left-color:var(--ok)}.scard.r{border-left-color:var(--bad)}.scard.y{border-left-color:var(--acc2)}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.slbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ssub{font-size:12px;color:var(--mut);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.w2{grid-column:span 2}.fg.wf{grid-column:1/-1}
.fg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--brown2)}
input,select,textarea{border:1.5px solid var(--line);border-radius:var(--rs);padding:8px 10px;background:#fff;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,56,30,.15)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical;min-height:60px}
.hint{font-size:12px;color:var(--mut)}
.ayuda{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);margin-bottom:14px;font-size:14px}
.ayuda>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:#78350f;list-style:none;display:flex;align-items:center;gap:8px}
.ayuda>summary::-webkit-details-marker{display:none}
.ayuda>summary::after{content:'Ver / ocultar';margin-left:auto;font-weight:500;font-size:12px;color:#a16207}
.ayuda .ay-b{padding:2px 16px 14px;color:#451a03;line-height:1.5}
.ayuda ol,.ayuda ul{margin:6px 0 6px 20px}.ayuda li{margin:3px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 15px;border-radius:var(--rs);border:1.5px solid transparent;cursor:pointer;font-weight:600;background:var(--brown);color:#fff;white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.o{background:var(--acc)}.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.y{background:var(--acc2);color:#422006}
.btn.l{background:#fff;color:var(--ink);border-color:var(--line)}.btn.l:hover{background:#faf9f8;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.big{padding:12px 20px;font-size:17px}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.srch{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:var(--rs);padding:0 10px;flex:1;min-width:200px;max-width:420px}
.srch input{border:0;box-shadow:none!important;padding:8px 0}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--brown);color:#fff;text-align:left;padding:9px 11px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:8px 11px;border-top:1px solid #efeae3;vertical-align:middle}
tbody tr:hover{background:#faf8f5}
tbody tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-gray{background:#ece7e0;color:#44403c}
.pos{color:var(--ok);font-weight:700}.neg2{color:var(--bad);font-weight:700}
.vacio{text-align:center;padding:34px 16px;color:var(--mut)}
.alert{padding:10px 14px;border-radius:var(--rs);margin-bottom:12px;font-size:14px}
.a-info{background:var(--infobg);color:#1e3a8a}.a-warn{background:var(--warnbg);color:#78350f}.a-bad{background:var(--badbg);color:#7f1d1d}.a-ok{background:var(--okbg);color:#14532d}
.tabs2{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs2 button{background:none;border:0;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs2 button.act{color:var(--acc);border-bottom-color:var(--acc)}
.moverlay{position:fixed;inset:0;background:rgba(31,26,23,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:3vh 10px;overflow-y:auto}
.modal{position:relative;background:#fff;border-radius:var(--r);padding:22px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1040px}
.mx{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:#f1efec;font-size:22px;line-height:1;cursor:pointer;z-index:2}.mx:hover{background:var(--badbg);color:var(--bad)}
.modal h2{font-size:24px;margin-bottom:14px;padding-right:36px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--brown) 0%,#1c130e 100%)}
.lbox{background:#fff;border-radius:16px;padding:30px 28px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.45);border-top:6px solid var(--acc)}
.lbox h1{font-size:34px;line-height:1}.lbox h1 b{color:var(--acc)}
.lbox .sub{color:var(--mut);margin:6px 0 18px}
.lbox .fg{margin-bottom:12px}
.lbox .or{text-align:center;color:var(--mut);font-size:13px;margin:12px 0}
.lbox .btn{width:100%}
.lerr{color:var(--bad);font-weight:600;font-size:14px;margin-bottom:10px}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
/* salón */
.mapa{position:relative;background:#fff;border:2px dashed var(--line);border-radius:var(--r);overflow:auto;min-height:420px;background-image:radial-gradient(#e8e2da 1px,transparent 1px);background-size:20px 20px}
.mapa .in{position:relative;min-width:100%}
.mesa{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #86efac;background:#f0fdf4;cursor:pointer;user-select:none;touch-action:none;text-align:center;line-height:1.1;padding:2px;transition:transform .1s}
.mesa:hover{transform:scale(1.04)}
.mesa.redonda{border-radius:50%}.mesa.cuadrada,.mesa.rectangular{border-radius:12px}
.mesa .mn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px}
.mesa .mi{font-size:11px;color:var(--mut);font-weight:600}
.mesa .mt{font-size:12px;font-weight:700}
.mesa.ocu{border-color:#fb923c;background:#fff7ed}
.mesa.lis{border-color:#3b82f6;background:#eff6ff;animation:pulso 1.4s infinite}
.mesa.edit{cursor:grab;border-style:dashed}
.mesa.sel{border-color:#16a34a;background:#bbf7d0;box-shadow:0 0 0 4px rgba(22,163,74,.35)}.mesa.bloq{opacity:.5;cursor:not-allowed}.mapa.mini{min-height:0;border-radius:14px;overflow:auto}
.croq{position:absolute;left:0;top:0;pointer-events:none}.croq.on{pointer-events:auto;cursor:crosshair;z-index:5}.croq line{stroke:#475569;stroke-width:6;stroke-linecap:round}.croq.er line{pointer-events:stroke;cursor:pointer}.croq.er line:hover{stroke:#dc2626}
@keyframes pulso{50%{box-shadow:0 0 0 6px rgba(59,130,246,.25)}}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;margin-right:4px;vertical-align:-1px}
/* comanda */
.cmd{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-weight:700;font-size:13px;cursor:pointer}
.chip.act{background:var(--brown);color:#fff;border-color:var(--brown)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:60vh;overflow-y:auto}
.prod{border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.prod:hover{border-color:var(--acc);background:#fff8f5}
.prod .pn{font-weight:700;line-height:1.15}.prod .pp{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--acc)}
.prod.off{opacity:.45}
.ticket{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;position:sticky;top:78px}
.citems{max-height:44vh;overflow-y:auto;margin:10px 0}
.cit{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid #efeae3;font-size:14px}
.cit .nm{font-weight:600}.cit .ctl{display:flex;gap:6px;align-items:center;grid-column:1/-1;flex-wrap:wrap}
.cit.anul .nm{text-decoration:line-through;color:var(--mut)}
.ttl{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:4px}
.trow{display:flex;justify-content:space-between;font-size:14px;padding:1px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{flex:1;padding:8px 4px;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);font-weight:700;font-size:13px;cursor:pointer;min-width:74px}
.seg button.act{background:var(--brown);color:#fff;border-color:var(--brown)}
/* cocina */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border-top:6px solid var(--acc2);padding:12px}
.kcard.old{border-top-color:var(--bad)}
.kcard h3{font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.kit{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #efeae3}
.kit.listo{opacity:.55}
.kcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.kcol{display:flex;flex-direction:column;gap:12px}.kcard.ok{border-top-color:#16a34a}
@media(max-width:800px){.kcols{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:2px solid var(--line);padding-top:10px}
.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.mini{height:8px;background:#ece7e0;border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:var(--acc)}
@media(max-width:900px){.cmd{grid-template-columns:1fr}.ticket{position:static}.g2{grid-template-columns:1fr}.fg.w2{grid-column:auto}main#main{padding:12px;margin-left:0}#hmenu{display:block}nav#nav{transform:translateX(-100%);transition:transform .2s;width:240px;box-shadow:4px 0 16px rgba(0,0,0,.25)}#app.nav-open nav#nav{transform:none}#app.nav-open #nbk{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:44}.hinfo .neg,#huser{display:none}.brand{font-size:20px}header.top{padding:0 12px}}
</style>
</head>
<body>
<div id="loading">Cargando…</div>
<section id="login" class="login hidden">
  <div class="lbox">
    <h1>Mi Gestor <b>Gastronomía</b></h1>
    <p class="sub">Salón, comandas, recetas, stock por ingrediente y caja.</p>
    <div id="lerr" class="lerr hidden"></div>
    <form id="lform" autocomplete="on">
      <div class="fg"><label for="lu">Usuario</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" required></div>
      <div class="fg"><label for="lp">Contraseña</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn o big" id="lbtn" type="submit">Ingresar</button>
    </form>
    <div class="or">— o —</div>
    <button class="btn l" id="ldemo" type="button">Probar una demo sin registrarme</button>
  </div>
</section>
<div id="app" class="hidden">
  <header class="top">
    <div style="display:flex;align-items:center;gap:6px"><button id="hmenu" type="button" aria-label="Menú">☰</button><div class="brand">Mi Gestor <b>Gastronomía</b></div></div>
    <div class="hinfo"><span id="hflag"></span><span class="neg" id="hneg"></span><span id="huser"></span><button class="btn l sm" id="hout" type="button">Salir</button></div>
  </header>
  <nav id="nav"></nav><div id="nbk"></div>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
const SB='https://yabschiaphpiozajnwxx.supabase.co';
const KEY='sb_publishable_BZlDsQFy_PFTx-01ZYt7rg_FN4IqLB5';
const SCH='gastronomia';
let S=null,CUR='',TIMER=null,C={};
const R={};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const fnum=(n,d=2)=>Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:d});
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdt=s=>s?new Date(s).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const fd=s=>s?new Date(s.length<=10?s+'T12:00:00':s).toLocaleDateString('es-AR'):'';
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const MODOS={salon:'🍽️ Comer acá',mostrador:'🏪 Mostrador',llevar:'🥡 Retira el cliente',delivery:'🛵 Delivery'};
const MEDIOS={efectivo:'Efectivo',transferencia:'Transferencia',debito:'Débito',credito:'Crédito',qr:'QR'};
const UNID={g:'g',kg:'kg',ml:'ml',l:'l',u:'u',feta:'fetas',unidad:'u'};
function esp(m){
  m=String(m||'');const l=m.toLowerCase();
  if(/failed to fetch|networkerror|load failed|network request/.test(l))return 'No hay conexión con el servidor. Revisá tu internet y probá de nuevo.';
  if(/duplicate key|already exists|unique/.test(l))return 'Ya existe un registro con ese dato (por ejemplo, un número repetido).';
  if(/foreign key/.test(l))return 'No se puede hacer: ese dato se está usando en otro lado.';
  if(/null value|not-null/.test(l))return 'Falta completar un dato obligatorio.';
  if(/check constraint/.test(l))return 'Hay un dato con un valor que no es válido. Revisalo.';
  if(/row-level security|permission denied|not authorized|forbidden/.test(l))return 'No tenés permiso para hacer esto.';
  if(/jwt|token/.test(l)&&/expired|invalid/.test(l))return 'Tu sesión venció. Volvé a ingresar.';
  if(/cannot read|undefined|is not a function|is not defined|syntaxerror|typeerror|referenceerror|unexpected token/.test(l))return 'Ocurrió un error inesperado. Probá de nuevo y, si sigue pasando, avisanos.';
  if(/[áéíóúñ¿¡]/i.test(m)||/^(poné|falta|elegí|cargá|completá|agregá|no |ya |este |tu |hay |primero)/i.test(m))return m;
  if(/\b(the|error|failed|invalid|not found|must|cannot|could not|unable)\b/.test(l))return 'Ocurrió un error. Probá de nuevo y, si sigue pasando, avisanos.';
  return m}
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=t==='err'?esp(m):m;$('#toast-root').appendChild(e);setTimeout(()=>e.remove(),t==='err'?5000:2600)}
function modal(html,o={}){const ov=document.createElement('div');ov.className='moverlay';ov.innerHTML='<div class="modal'+(o.wide?' wide':'')+'"><button class="mx" type="button" aria-label="Cerrar">×</button>'+html+'</div>';const close=()=>{ov.remove()};ov.querySelector('.mx').onclick=close;ov.addEventListener('mousedown',e=>{if(e.target===ov&&!o.sticky)close()});$('#modal-root').appendChild(ov);ov.close=close;return ov}
function ask(msg,ok='Confirmar',danger){return new Promise(res=>{const m=modal('<h2>'+esc(msg)+'</h2><div class="mfoot"><button class="btn l" data-n>Cancelar</button><button class="btn '+(danger?'r':'o')+'" data-y>'+esc(ok)+'</button></div>');m.querySelector('[data-n]').onclick=()=>{m.close();res(false)};m.querySelector('.mx').onclick=()=>{m.close();res(false)};m.querySelector('[data-y]').onclick=()=>{m.close();res(true)}})}
async function busy(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message||'Error','err')}finally{if(btn)btn.disabled=false}}
async function api(method,path,body,prefer){
  const h={apikey:KEY,Authorization:'Bearer '+(S?S.token:KEY),'Accept-Profile':SCH,'Content-Profile':SCH,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB+'/rest/v1/'+path,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){if(r.status===401){toast('Tu sesión venció. Volvé a ingresar.','err');setTimeout(()=>logout(true),800)}
    throw new Error(esp((d&&(d.message||d.hint))||'Error '+r.status))}
  return d}

const upd=(t,id,row)=>api('PATCH',t+'?id=eq.'+id,row,'return=representation');

async function catalogos(force){
  if(C.ok&&!force)return C;
  const [cats,prods,zonas]=await Promise.all([get('categorias?select=*&order=orden,nombre'),get('productos?select=*&activo=eq.true&order=orden,nombre'),get('zonas?select=*&order=orden,nombre')]);

async function login(body){
  const r=await fetch(SB+'/functions/v1/login-gastronomia',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'No se pudo ingresar');
  S=d;try{sessionStorage.setItem('mgg',JSON.stringify(S))}catch(e){}
  start()}
function logout(){
  S=null;C={};stopTimer();try{sessionStorage.removeItem('mgg')}catch(e){}
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#lerr').classList.add('hidden');
  const a=document.getElementById('demo-aviso');if(a)a.remove();
  try{history.replaceState(null,'',location.pathname)}catch(e){}}

        sv.onpointerup=e=>{if(!a)return;const b=[+ln.getAttribute('x2'),+ln.getAttribute('y2')];const o=a;a=null;if(Math.abs(b[0]-o[0])+Math.abs(b[1]-o[1])<10){ln.remove();return}guardar(croq.concat([{x1:o[0],y1:o[1],x2:b[0],y2:b[1]}]))}}

function arrastrar(el,m){
  let sx,sy,ox,oy,mov=false;
  el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=m.pos_x;oy=m.pos_y;mov=false;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)mov=true;if(mov){el.style.left=Math.max(0,Math.round((ox+dx)/10)*10)+'px';el.style.top=Math.max(0,Math.round((oy+dy)/10)*10)+'px'}};
    el.onpointerup=async()=>{el.onpointermove=null;el.onpointerup=null;
      if(!mov){editMesa(m);return}
      const x=parseInt(el.style.left),y=parseInt(el.style.top);
      try{await upd('mesas',m.id,{pos_x:x,pos_y:y});m.pos_x=x;m.pos_y=y}catch(err){toast(err.message,'err');R.salon()}}}}

    else{const nn=$('#nn',mo).value.trim();if(modo==='llevar'&&!nn)throw new Error('Poné el nombre de quien retira');if(modo==='delivery'&&!$('#nd',mo).value.trim())throw new Error('Poné la dirección de entrega');
      patch={modo,mesa_id:null,cliente_nombre:nn||null,telefono:modo==='delivery'?$('#nt',mo).value.trim()||null:c.telefono,direccion_entrega:modo==='delivery'?$('#nd',mo).value.trim()||null:c.direccion_entrega}}

let CM={cat:'',q:''};
R.comanda=async function(id){
  const [cat,[c],items]=await Promise.all([catalogos(),get('comandas?select=*&id=eq.'+id),get('comanda_items?select=*&comanda_id=eq.'+id+'&order=created_at')]);
  if(!c){toast('No se encontró la comanda','err');return go('salon')}
  let mesa=null;if(c.mesa_id){const mm=await get('mesas?select=numero,nombre&id=eq.'+c.mesa_id);mesa=mm[0]}
  const abierta=c.estado==='abierta';
  const activos=items.filter(i=>i.estado!=='anulado');
  const sub=activos.reduce((a,i)=>a+Number(i.subtotal||0),0);
  const prods=cat.prods.filter(p=>(!CM.cat||p.categoria_id===CM.cat)&&(!CM.q||p.nombre.toLowerCase().includes(CM.q.toLowerCase())));
  const ETQ={pendiente:['b-gray','Sin enviar'],en_cocina:['b-warn','En cocina'],listo:['b-info','Listo en cocina'],servido:['b-ok','Entregado'],anulado:['b-bad','Anulado']};
  main(ayuda('Cómo usar el pedido','<ol><li>Tocá los <b>productos</b> de la izquierda para sumarlos. Con <b>−</b> y <b>+</b> cambiás la cantidad y con <b>📝</b> indicás lo que no lleva (SIN) o los extras (CON).</li><li>Tocá <b>Enviar a cocina</b>: cocina ve solo lo que todavía no mandaste. Si el cliente pide algo más, lo sumás y lo volvés a enviar.</li><li><b>Mesa / tipo</b> cambia el pedido de mesa o lo convierte en mostrador, retira el cliente o delivery.</li><li>Cuando termina, tocá <b>Cobrar</b>: elegís el medio de pago, o <b>Pago combinado</b> si paga con varios.</li><li><b>Anular</b> cancela todo el pedido. Para <b>🖨️</b> imprimir la comanda.</li></ol>')+'<div class="brow"><button class="btn l sm" id="cv">← Volver</button><h2 class="cond" style="font-size:26px">'+(mesa?'Mesa '+mesa.numero:MODOS[c.modo])+' <span class="hint">#'+c.numero+'</span></h2><span class="sp"></span>'+(abierta?'<span class="badge b-warn">Abierta</span>':'<span class="badge b-gray">'+c.estado+'</span>')+'</div>'+
  '<div class="cmd"><div>'+(abierta?'<div class="chips"><button class="chip'+(!CM.cat?' act':'')+'" data-k="">Todos</button>'+cat.cats.map(k=>'<button class="chip'+(CM.cat===k.id?' act':'')+'" data-k="'+k.id+'">'+esc(k.nombre)+'</button>').join('')+'</div><div class="srch" style="margin-bottom:10px;max-width:none"><span>🔍</span><input id="cq" placeholder="Buscar producto" value="'+esc(CM.q)+'"></div><div class="pgrid">'+(prods.map(p=>'<button class="prod'+(p.disponible?'':' off')+'" data-p="'+p.id+'"><span class="pn">'+esc(p.nombre)+'</span><span class="pp">'+money(p.precio)+'</span>'+(p.disponible?'':'<span class="hint">No disponible</span>')+'</button>').join('')||'<div class="vacio">Sin productos</div>')+'</div>':'<div class="alert a-info">Esta comanda ya está cerrada.</div>')+'</div>'+
  '<div class="ticket"><div class="hint">'+(c.cliente_nombre?esc(c.cliente_nombre)+' · ':'')+(c.cubiertos?c.cubiertos+' cubiertos · ':'')+esc(c.mozo_nombre||'')+(c.direccion_entrega?'<br>📍 '+esc(c.direccion_entrega):'')+'</div><div class="citems">'+
  (items.map(i=>'<div class="cit'+(i.estado==='anulado'?' anul':'')+'"><div class="nm">'+fnum(i.cantidad,0)+' × '+esc(i.descripcion)+(i.llevar&&c.modo!=='llevar'&&c.modo!=='delivery'?' 📦':'')+'</div><div class="n">'+money(i.subtotal)+'</div><div class="ctl"><span class="badge '+ETQ[i.estado][0]+'">'+ETQ[i.estado][1]+'</span>'+(abierta&&i.estado==='pendiente'?'<button class="btn sm l" data-m="'+i.id+'">−</button><button class="btn sm l" data-a="'+i.id+'">+</button>':'')+(abierta&&i.estado!=='anulado'&&c.modo!=='llevar'&&c.modo!=='delivery'?'<button class="btn sm l" data-ll="'+i.id+'" title="Para llevar: usa descartables">'+(i.llevar?'📦 Llevar':'🍽️ Acá')+'</button>':'')+(abierta&&i.estado==='listo'?'<button class="btn sm g" data-sv="'+i.id+'">🤝 Entregar</button>':'')+(abierta&&i.estado!=='anulado'?'<button class="btn sm l" data-n="'+i.id+'" title="Con / sin">📝 Con/Sin</button><button class="btn sm l" data-x="'+i.id+'">✕</button>':'')+(i.notas?'<span class="hint" style="color:#b91c1c;font-weight:700">'+esc(i.notas)+'</span>':'')+'</div></div>').join('')||'<div class="vacio">Todavía no hay nada cargado</div>')+'</div>'+
  '<div class="ttl"><span>Total</span><span>'+money(sub)+'</span></div>'+
  (abierta?'<div class="brow" style="margin-top:12px"><button class="btn y" id="ce"'+(items.some(i=>i.estado==='pendiente')?'':' disabled')+'>🍳 Enviar a cocina</button>'+(puede('admin','cajero')?'<button class="btn g" id="cc"'+(sub>0?'':' disabled')+'>💵 Cobrar</button>':'')+'<button class="btn l sm" id="cm">✏️ Mesa / tipo</button>'+'<button class="btn l sm" id="cp">🖨️</button><button class="btn r sm" id="ca">Anular</button></div>':'')+'</div></div>');
  const re=()=>R.comanda(id);
  $('#cv').onclick=()=>go('salon');
  $('#main').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{CM.cat=b.dataset.k;re()});
  const q=$('#cq');if(q)q.oninput=e=>{CM.q=e.target.value;clearTimeout(q._t);q._t=setTimeout(()=>{re().then(()=>{const n=$('#cq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}})},350)};
  $('#main').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>busy(null,async()=>{
    const p=cat.prods.find(x=>x.id===b.dataset.p);if(!p.disponible)return toast('Producto no disponible','err');
    const llevar=c.modo==='llevar'||c.modo==='delivery';
    const ex=items.find(i=>i.producto_id===p.id&&i.estado==='pendiente'&&!i.notas&&!!i.llevar===llevar);
    if(ex)await upd('comanda_items',ex.id,{cantidad:Number(ex.cantidad)+1});
    else await ins('comanda_items',{comanda_id:id,producto_id:p.id,cantidad:1,llevar});
    re()}));
  const byId=x=>items.find(i=>i.id===x);
  $('#main').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>busy(null,async()=>{const i=byId(b.dataset.a);await upd('comanda_items',i.id,{cantidad:Number(i.cantidad)+1});re()}));
  $('#main').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>busy(null,async()=>{const i=byId(b.dataset.m);if(i.cantidad>1)await upd('comanda_items',i.id,{cantidad:Number(i.cantidad)-1});else await del('comanda_items',i.id);re()}));
  $('#main').querySelectorAll('[data-ll]').forEach(b=>b.onclick=()=>busy(null,async()=>{const i=byId(b.dataset.ll);await upd('comanda_items',i.id,{llevar:!i.llevar});re()}));
  $('#main').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const i=byId(b.dataset.n);notaModal(i.producto_id,i.descripcion,i.notas,async v=>{await upd('comanda_items',i.id,{notas:v});re()})});
  $('#main').querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>busy(b,async()=>{await upd('comanda_items',b.dataset.sv,{estado:'servido'});re()}));
  $('#main').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const i=byId(b.dataset.x);if(!await ask('¿Sacar "'+i.descripcion+'"?','Sacar',true))return;busy(null,async()=>{if(i.estado==='pendiente')await del('comanda_items',i.id);else await upd('comanda_items',i.id,{estado:'anulado'});re()})});
  if(abierta){
    $('#ce').onclick=e=>busy(e.target,async()=>{await rpc('enviar_a_cocina',{p_comanda:id});toast('Enviado a cocina','ok');re()});
    if($('#cc'))$('#cc').onclick=()=>cobrarModal(c,sub,re);
    if($('#cm'))$('#cm').onclick=()=>editarPedido(c,re);
    $('#cp').onclick=()=>imprimirComanda(c,mesa,activos,sub);
    $('#ca').onclick=async()=>{if(!await ask('¿Anular toda la comanda?','Anular',true))return;busy(null,async()=>{await rpc('anular_comanda',{p_comanda:id,p_motivo:'Anulada desde el salón'});go('salon')})}}
  auto(()=>{if(CUR==='comanda')re()},20000)};
async function notaModal(prodId,titulo,actual,guardar){
  let ings=[];try{if(prodId){const r=await get('receta_items?select=aplica,insumos(nombre,tipo)&producto_id=eq.'+prodId);const seen={};r.forEach(x=>{const n=x.insumos&&x.insumos.tipo==='ingrediente'?x.insumos.nombre:null;if(n&&!seen[n]){seen[n]=1;ings.push(n)}})}}catch(e){}
  const mo=modal('<h2>'+esc(titulo)+'</h2><div class="hint" style="margin-bottom:6px">SIN (tocá lo que NO lleva)</div><div class="chips" id="sn">'+(ings.map(n=>'<button type="button" class="chip" data-s="'+esc(n)+'">Sin '+esc(n.toLowerCase())+'</button>').join('')||'<span class="hint">Este producto no tiene receta cargada.</span>')+'</div><div class="hint" style="margin-bottom:6px">CON (extras o agregados)</div><div class="brow"><input id="cx" placeholder="Ej: extra queso" style="flex:1"><button type="button" class="btn l sm" id="cxa">+ Agregar</button></div><div class="fg"><label>Nota para cocina</label><textarea id="nt" placeholder="Ej: bien cocido">'+esc(actual||'')+'</textarea></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');
  const ta=$('#nt',mo);const rd=()=>ta.value.split(',').map(t=>t.trim()).filter(Boolean);
  const pintar=()=>{const t=rd().map(x=>x.toLowerCase());mo.querySelectorAll('[data-s]').forEach(c=>c.classList.toggle('act',t.includes('sin '+c.dataset.s.toLowerCase())))};
  mo.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{const tk='sin '+c.dataset.s.toLowerCase();let a=rd();const k=a.findIndex(x=>x.toLowerCase()===tk);if(k>=0)a.splice(k,1);else a.push('SIN '+c.dataset.s.toLowerCase());ta.value=a.join(', ');pintar()});
  $('#cxa',mo).onclick=()=>{const v=$('#cx',mo).value.trim();if(!v)return;const a=rd();a.push('CON '+v);ta.value=a.join(', ');$('#cx',mo).value='';pintar()};
  ta.oninput=pintar;pintar();
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{await guardar(ta.value.trim()||null);mo.close()})}
async function moverModal(c,re){
  const ms=await get('mesas_estado?select=id,numero,comanda_id&activa=eq.true&order=numero');
  const libres=ms.filter(m=>!m.comanda_id);
  const mo=modal('<h2>Mover a otra mesa</h2>'+(libres.length?'<div class="chips">'+libres.map(m=>'<button class="chip" data-t="'+m.id+'">Mesa '+m.numero+'</button>').join('')+'</div>':'<div class="vacio">No hay mesas libres</div>'));
  mo.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>busy(b,async()=>{await rpc('mover_comanda',{p_comanda:c.id,p_mesa:b.dataset.t});mo.close();re()}))}
function cobrarModal(c,sub,re,fin){
  const ICO={efectivo:'💵',transferencia:'🏦',debito:'💳',credito:'💳',qr:'📱'};
  const mo=modal('<h2>Cobrar · '+money(sub)+'</h2><div class="fgrid"><div class="fg"><label>Descuento %</label><input id="dp" type="number" min="0" max="100" value="0" inputmode="decimal"></div><div class="fg"><label>Propina $</label><input id="pr" type="number" min="0" value="0" inputmode="decimal"></div></div><div class="hint" id="ph" style="margin:6px 0"></div><div class="chips" id="mp"></div><div id="pgs"></div><div class="trow" style="margin-top:12px"><span>Total a cobrar</span><b id="tt" style="font-size:22px"></b></div><div class="trow"><span id="fll">Falta cargar</span><b id="fl"></b></div><div class="mfoot"><button class="btn g big" id="ok">Confirmar cobro</button></div>');
  const tot=()=>Math.round((sub-sub*Math.min(100,Math.max(0,num($('#dp',mo).value)))/100+Math.max(0,num($('#pr',mo).value)))*100)/100;
  let pgs=[{medio:'efectivo',monto:''}],comb=false;
  const falta=()=>Math.round((tot()-pgs.reduce((a,p)=>a+num(p.monto),0))*100)/100;
  const calc=()=>{const t=tot();$('#tt',mo).textContent=money(t);const f=falta();$('#fll',mo).textContent=f<-0.5?'Sobra':'Falta cargar';$('#fl',mo).textContent=money(Math.abs(f));$('#fl',mo).className=Math.abs(f)<0.5?'pos':'neg2'};
  const draw=()=>{
    $('#ph',mo).textContent=comb?'Pago combinado: tocá todos los medios que use el cliente y cargá cuánto va en cada uno.':'Tocá el medio de pago. Si paga con varios medios, tocá “Pago combinado”.';
    $('#mp',mo).innerHTML=Object.keys(MEDIOS).map(k=>'<button type="button" class="chip'+(pgs.some(p=>p.medio===k)?' act':'')+'" data-k="'+k+'" style="font-size:15px;padding:9px 16px">'+ICO[k]+' '+MEDIOS[k]+'</button>').join('')+'<button type="button" class="chip'+(comb?' act':'')+'" id="pcb" style="font-size:15px;padding:9px 16px;border-style:dashed">➕ Pago combinado</button>';
    $('#pgs',mo).innerHTML=pgs.length>1?pgs.map((p,i)=>'<div class="brow"><b style="width:140px">'+ICO[p.medio]+' '+MEDIOS[p.medio]+'</b><input class="pv" data-i="'+i+'" type="number" inputmode="decimal" value="'+p.monto+'" placeholder="Monto" style="width:140px"><button type="button" class="btn sm l" data-r="'+i+'">Todo el resto</button></div>').join(''):'';
    $('#pcb',mo).onclick=()=>{comb=!comb;if(!comb&&pgs.length>1)pgs=[pgs[0]];if(pgs.length===1)pgs[0].monto=tot();draw();calc()};
    mo.querySelectorAll('#mp [data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,i=pgs.findIndex(p=>p.medio===k);
      if(!comb){pgs=[{medio:k,monto:tot()}]}
      else if(i>=0){if(pgs.length===1)return;pgs.splice(i,1);if(pgs.length===1)pgs[0].monto=tot()}
      else{if(pgs.length===1)pgs[0].monto=pgs[0].monto===''||num(pgs[0].monto)>=tot()-0.5?Math.round(tot()/2*100)/100:pgs[0].monto;pgs.push({medio:k,monto:Math.max(0,falta())})}
      draw();calc()});
    mo.querySelectorAll('.pv').forEach(s=>s.oninput=()=>{pgs[s.dataset.i].monto=s.value;calc()});
    mo.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const i=+b.dataset.r;const otros=pgs.reduce((a,p,j)=>j===i?a:a+num(p.monto),0);pgs[i].monto=Math.max(0,Math.round((tot()-otros)*100)/100);draw();calc()})};
  ['dp','pr'].forEach(k=>$('#'+k,mo).oninput=()=>{if(pgs.length===1)pgs[0].monto=tot();draw();calc()});
  pgs[0].monto=tot();draw();calc();
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{
    if(Math.abs(falta())>=0.5)throw new Error(falta()>0?'Falta cargar '+money(falta())+' para completar el pago.':'Los montos superan el total en '+money(-falta())+'.');
    const r=await rpc('cobrar_comanda',{p_comanda:c.id,p_pagos:pgs.filter(p=>num(p.monto)>0).map(p=>({medio:p.medio,monto:num(p.monto)})),p_descuento_pct:num($('#dp',mo).value),p_propina:num($('#pr',mo).value)});
    mo.close();toast('Cobrado ✔ '+money(r.total),'ok');
    if(r.stock_bajo&&r.stock_bajo.length)setTimeout(()=>toast('Stock bajo: '+r.stock_bajo.join(', ')),1500);
    if(fin)fin();else go('salon')})}
function ventana(titulo,cuerpo){
  const w=window.open('','_blank','width=420,height=640');if(!w){toast('Habilitá las ventanas emergentes para imprimir','err');return}
  w.document.write('<html><head><title>'+esc(titulo)+'</title><style>body{font-family:monospace;font-size:13px;padding:10px;max-width:320px}h2{text-align:center;margin:4px 0}table{width:100%}td.r{text-align:right}hr{border:0;border-top:1px dashed #000}</style></head><body>'+cuerpo+'<script>window.print()<\/script></body></html>');w.document.close()}
function imprimirComanda(c,mesa,items,sub){
  ventana('Comanda','<h2>'+esc(S.negocio.nombre)+'</h2><div style="text-align:center">'+(mesa?'Mesa '+mesa.numero:MODOS[c.modo])+' · #'+c.numero+'<br>'+new Date().toLocaleString('es-AR')+'</div><hr><table>'+items.map(i=>'<tr><td>'+fnum(i.cantidad,0)+' × '+esc(i.descripcion)+(i.notas?'<br>&nbsp;&nbsp;» '+esc(i.notas):'')+'</td><td class="n">'+money(i.subtotal)+'</td></tr>').join('')+'</table><hr><table><tr><td><b>TOTAL</b></td><td class="n"><b>'+money(sub)+'</b></td></tr></table><p style="text-align:center">Ticket no válido como factura</p>')}

/* ---------- COCINA ---------- */
const COC={seen:null,ac:null,sound:false,print:false,hist:false,fecha:'',hrows:[]};
try{const z=JSON.parse(localStorage.getItem('mgg_coc')||'{}');COC.sound=!!z.sound;COC.print=!!z.print}catch(e){}
function cocGuardar(){try{localStorage.setItem('mgg_coc',JSON.stringify({sound:COC.sound,print:COC.print}))}catch(e){}}
function cocAudio(){try{if(!COC.ac)COC.ac=new (window.AudioContext||window.webkitAudioContext)();if(COC.ac.state==='suspended')COC.ac.resume()}catch(e){}return COC.ac}
document.addEventListener('click',()=>{if(COC.sound)cocAudio()});
function cocBeep(){const ac=cocAudio();if(!ac)return;[[880,0],[1175,.28]].forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const a=ac.currentTime+t;g.gain.setValueAtTime(0.0001,a);g.gain.exponentialRampToValueAtTime(0.5,a+.03);g.gain.exponentialRampToValueAtTime(0.0001,a+.25);o.start(a);o.stop(a+.3)})}
function imprimirCocina(items){
  const g={};items.forEach(i=>{(g[i.comanda_id]=g[i.comanda_id]||{h:i,items:[]}).items.push(i)});
  ventana('Cocina',Object.values(g).map(k=>'<h2>'+(k.h.mesa_numero?'MESA '+k.h.mesa_numero:esc((MODOS[k.h.modo]||k.h.modo).replace(/^\S+\s/,'').toUpperCase()))+'</h2><div style="text-align:center">Pedido #'+k.h.comanda_numero+' · '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'</div><hr><table>'+k.items.map(i=>'<tr><td style="font-size:16px"><b>'+fnum(i.cantidad,0)+' ×</b> '+esc(i.descripcion)+(i.llevar?' (PARA LLEVAR)':'')+(i.notas?'<br><b>» '+esc(i.notas)+'</b>':'')+'</td></tr>').join('')+'</table><hr style="margin-bottom:24px">').join(''))}
R.cocina=async function(){
  const rows=await get('cocina_items?select=*&estado=in.(en_cocina,listo)&order=enviado_at');
  if(!COC.fecha)COC.fecha=hoy();
  if(COC.hist){const d0=new Date(COC.fecha+'T00:00:00');COC.hrows=await get('cocina_entregados?select=*&enviado_at=gte.'+encodeURIComponent(d0.toISOString())+'&enviado_at=lt.'+encodeURIComponent(new Date(d0.getTime()+864e5).toISOString())+'&order=enviado_at.desc&limit=300')}else COC.hrows=[];
  if(COC.seen===null)COC.seen=new Set(rows.map(r=>r.id));
  else{const nuevos=rows.filter(r=>r.estado==='en_cocina'&&!COC.seen.has(r.id));rows.forEach(r=>COC.seen.add(r.id));
    if(nuevos.length){if(COC.sound)cocBeep();if(COC.print)imprimirCocina(nuevos)}}
  const puedeEnt=puede('admin','cajero','mozo');
  const col=est=>{const g={};rows.filter(r=>r.estado===est).forEach(r=>{(g[r.comanda_id]=g[r.comanda_id]||{h:r,items:[]}).items.push(r)});return Object.values(g)};
  const prep=col('en_cocina'),listo=col('listo');
  const tarjeta=(k,tipo)=>{const min=Math.round((Date.now()-new Date(k.h.enviado_at))/60000),cob=k.h.comanda_estado==='cerrada';
    return '<div class="kcard'+(tipo==='prep'&&min>20?' old':'')+(tipo==='listo'?' ok':'')+'"><h3><span>'+(k.h.mesa_numero?'Mesa '+k.h.mesa_numero:MODOS[k.h.modo])+(k.h.cliente_nombre?' · '+esc(k.h.cliente_nombre):'')+'</span><small class="hint">#'+k.h.comanda_numero+' · hace '+min+' min</small></h3>'+
    '<div style="margin:2px 0 6px">'+(cob?'<span class="badge b-ok">💵 Cobrado</span>':'<span class="badge b-warn">Falta cobrar</span>')+'</div>'+
    k.items.map(i=>'<div class="kit"><div><b>'+fnum(i.cantidad,0)+' ×</b> '+esc(i.descripcion)+(i.llevar?' 📦':'')+(i.notas?'<br><b style="color:#b91c1c">📝 '+esc(i.notas)+'</b>':'')+'</div>'+(tipo==='prep'?'<button class="btn g sm" data-l="'+i.id+'">Listo</button>':'')+'</div>').join('')+
    (tipo==='listo'&&puedeEnt?'<div class="brow" style="margin-top:8px"><button class="btn g" data-en="'+k.h.comanda_id+'">🤝 Entregar al cliente</button>'+(cob?'':'<button class="btn l sm" data-ab="'+k.h.comanda_id+'">💵 Abrir / cobrar</button>')+'</div>':'')+'</div>'};

async function simpleCrud(cfg,reload){
  const rows=await get(cfg.t+'?select=*&order='+cfg.order);
  const q=(cfg.q||'').toLowerCase();
  const vis=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
  const body=(cfg.ayuda?ayuda(cfg.ayuda[0],cfg.ayuda[1]):'')+'<div class="brow"><div class="srch"><span>🔍</span><input id="cq" placeholder="Buscar" value="'+esc(cfg.q||'')+'"></div><span class="sp"></span><button class="btn o" id="cn">+ Nuevo</button></div>'+
  (vis.length?'<div class="twrap"><table><thead><tr>'+cfg.cols.map(c=>'<th>'+c[0]+'</th>').join('')+'<th></th></tr></thead><tbody>'+vis.map(r=>'<tr>'+cfg.cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'<td class="n"><button class="btn sm l" data-e="'+r.id+'">Editar</button></td></tr>').join('')+'</tbody></table></div>':'<div class="vacio">Todavía no hay nada cargado</div>');
  const cont=cfg.into?$(cfg.into):null;
  if(cont)cont.innerHTML=body;else main('<div class="panel"><div class="ptit">'+cfg.title+'</div>'+body+'</div>');
  const root=cont||$('#main');
  const rl=cont?()=>simpleCrud(cfg,reload):reload;
  const qi=$('#cq',root);if(cfg.q){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  let tm;qi.oninput=e=>{cfg.q=e.target.value;clearTimeout(tm);tm=setTimeout(rl,350)};
  const form=r=>{
    const mo=modal('<h2>'+(r?'Editar':'Nuevo')+'</h2><div class="fgrid">'+cfg.fields.map(f=>'<div class="fg'+(f.w?' '+f.w:'')+'"><label>'+f.l+'</label>'+(f.type==='area'?'<textarea data-f="'+f.k+'">'+esc(r?.[f.k]||'')+'</textarea>':'<input data-f="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(r?.[f.k]??f.def??'')+'">')+'</div>').join('')+'</div><div class="mfoot">'+(r&&cfg.del?'<button class="btn r" id="el">Eliminar</button>':'')+'<button class="btn o" id="ok">Guardar</button></div>');
    $('#ok',mo).onclick=e=>busy(e.target,async()=>{const d={};mo.querySelectorAll('[data-f]').forEach(i=>{const f=cfg.fields.find(x=>x.k===i.dataset.f);let v=i.value.trim();d[f.k]=f.type==='number'?(v===''?null:num(v)):(v===''?null:v)});
      if(cfg.fields.find(f=>f.req&&!d[f.k]))throw new Error('Completá los datos obligatorios');
      if(r)await upd(cfg.t,r.id,d);else await ins(cfg.t,d);mo.close();if(cfg.after)cfg.after();rl()});
    if(r&&cfg.del)$('#el',mo).onclick=async e=>{if(!await ask('¿Eliminar este registro?','Eliminar',true))return;busy(e.target,async()=>{try{await del(cfg.t,r.id)}catch(er){if(cfg.soft)await upd(cfg.t,r.id,{activo:false});else throw new Error('No se puede eliminar: se está usando. Probá editarlo.')}mo.close();if(cfg.after)cfg.after();rl()})}};
  $('#cn',root).onclick=()=>form(null);
  root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(rows.find(x=>x.id===b.dataset.e)))}
const CFG_CLI={t:'clientes',title:'Clientes',order:'nombre',del:true,soft:true,q:'',ayuda:['Clientes','<p>Guardá los datos de quienes piden por delivery o encargan seguido.</p>'],
  cols:[['Nombre',r=>r.nombre],['Teléfono',r=>r.telefono||''],['Dirección',r=>r.direccion||'']],
  fields:[{k:'nombre',l:'Nombre',req:1},{k:'telefono',l:'Teléfono'},{k:'email',l:'Email'},{k:'direccion',l:'Dirección',w:'w2'},{k:'notas',l:'Notas',type:'area',w:'wf'}]};
R.clientes=function(){return simpleCrud(CFG_CLI,R.clientes)};

let PR={q:'',cat:''};
R.productos=async function(){
  const [cat,pc,all]=await Promise.all([catalogos(true),get('productos_costo?select=*'),get('productos?select=*&order=orden,nombre')]);

  '<div class="brow"><div class="srch"><span>🔍</span><input id="pq" placeholder="Buscar producto" value="'+esc(PR.q)+'"></div><select id="pk" style="width:auto"><option value="">Todas las categorías</option>'+cat.cats.map(k=>'<option value="'+k.id+'"'+(PR.cat===k.id?' selected':'')+'>'+esc(k.nombre)+'</option>').join('')+'</select><span class="sp"></span><button class="btn o" id="pn">+ Nuevo producto</button></div>'+
  (vis.length?'<div class="twrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="n">Precio</th><th class="n">Costo acá</th><th class="n">Costo llevar</th><th class="n">Margen</th><th>Receta</th><th></th></tr></thead><tbody>'+vis.map(p=>{const c=cm[p.id]||{};const mg=p.precio>0?Math.round((1-Number(c.costo_salon||0)/p.precio)*100):0;return '<tr class="click" data-e="'+p.id+'"><td><b>'+esc(p.nombre)+'</b>'+(p.activo?'':' <span class="badge b-gray">Inactivo</span>')+(p.disponible?'':' <span class="badge b-warn">Sin stock</span>')+'</td><td>'+esc(kn[p.categoria_id]||'')+'</td><td class="n">'+money(p.precio)+'</td><td class="n">'+money(c.costo_salon)+'</td><td class="n">'+money(c.costo_llevar)+'</td><td class="n '+(mg<30?'neg2':'pos')+'">'+mg+'%</td><td>'+(c.lineas_receta?c.lineas_receta+' insumos':'<span class="badge b-warn">Sin receta</span>')+'</td><td class="n"><button class="btn sm l">Editar</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="panel vacio">No hay productos todavía</div>'));
  let tm;$('#pq').oninput=e=>{PR.q=e.target.value;clearTimeout(tm);tm=setTimeout(()=>R.productos(),350)};
  $('#pk').onchange=e=>{PR.cat=e.target.value;R.productos()};
  $('#pn').onclick=()=>editProducto(null);
  document.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>editProducto(all.find(x=>x.id===r.dataset.e)))};
async function editProducto(p){
  const [ins_,rec]=await Promise.all([get('insumos?select=id,nombre,unidad,tipo,costo&activo=eq.true&order=tipo,nombre'),p?get('receta_items?select=*&producto_id=eq.'+p.id):[]]);

  '<div class="ptit" style="margin-top:8px">Receta <span class="sp"></span><button class="btn sm l" id="an">+ Insumo nuevo</button><button class="btn sm l" id="al">+ Agregar insumo</button></div><div id="rl"></div><div class="hint" id="rc"></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>',{wide:true});

    $('#rl',mo).innerHTML=lines.length?'<div class="twrap"><table><thead><tr><th>Insumo</th><th>Cantidad</th><th>Aclaración</th><th>Cuándo se usa</th><th class="n">Costo</th><th></th></tr></thead><tbody>'+lines.map((l,i)=>{const it=ins_.find(x=>x.id===l.insumo_id);return '<tr><td><select data-i="'+i+'" class="li"><option value="">— elegir —</option>'+['ingrediente','descartable'].map(t=>'<optgroup label="'+(t==='ingrediente'?'Ingredientes':'Descartables')+'">'+ins_.filter(x=>x.tipo===t).map(x=>'<option value="'+x.id+'"'+(l.insumo_id===x.id?' selected':'')+'>'+esc(x.nombre)+' ('+esc(x.unidad)+')</option>').join('')+'</optgroup>').join('')+'</select></td><td style="width:130px"><input data-i="'+i+'" class="lc" type="number" step="any" inputmode="decimal" value="'+l.cantidad+'"> <small class="hint">'+esc(it?.unidad||'')+'</small></td><td><input data-i="'+i+'" class="ln" value="'+esc(l.nota||'')+'" placeholder="Ej: equivale a 5 fetas"></td><td><select data-i="'+i+'" class="la"><option value="siempre"'+(l.aplica==='siempre'?' selected':'')+'>Siempre</option><option value="salon"'+(l.aplica==='salon'?' selected':'')+'>Solo comer acá</option><option value="llevar"'+(l.aplica==='llevar'?' selected':'')+'>Solo para llevar</option></select></td><td class="n">'+money(cost(l))+'</td><td><button class="btn sm l" data-d="'+i+'">✕</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="vacio">Todavía no tiene receta. Agregá los insumos que lleva.</div>';
    mo.querySelectorAll('.li').forEach(s=>s.onchange=()=>{lines[s.dataset.i].insumo_id=s.value;draw()});
    mo.querySelectorAll('.lc').forEach(s=>s.oninput=()=>{lines[s.dataset.i].cantidad=s.value;sum()});
    mo.querySelectorAll('.la').forEach(s=>s.onchange=()=>{lines[s.dataset.i].aplica=s.value;sum()});
    mo.querySelectorAll('.ln').forEach(s=>s.oninput=()=>{lines[s.dataset.i].nota=s.value});
    mo.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.d,1);draw()});sum()};
  const sum=()=>{const a=lines.filter(l=>l.aplica!=='llevar').reduce((x,l)=>x+cost(l),0),b=lines.filter(l=>l.aplica!=='salon').reduce((x,l)=>x+cost(l),0);$('#rc',mo).textContent='Costo comiendo acá: '+money(a)+' · Costo para llevar: '+money(b)};
  $('#al',mo).onclick=()=>{lines.push({insumo_id:'',cantidad:'',aplica:'siempre',nota:''});draw()};
  $('#an',mo).onclick=async()=>{const pv=await get('proveedores?select=id,nombre&activo=eq.true&order=nombre');insumoRapido(pv,x=>{ins_.push(x);lines.push({insumo_id:x.id,cantidad:'',aplica:'siempre',nota:''});draw()})};
  draw();
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{
    const d={nombre:$('#pn1',mo).value.trim(),precio:num($('#pp',mo).value),categoria_id:$('#pc',mo).value||null,codigo:$('#pcd',mo).value.trim()||null,disponible:$('#pd',mo).value==='true',activo:$('#pa',mo).value==='true'};

    if(lines.length!==ok.length&&!await ask('Hay líneas de receta incompletas. ¿Guardar sin ellas?','Guardar'))return;
    let id=p?.id;
    if(nuevo){const r=await ins('productos',d);id=r[0].id}else await upd('productos',id,d);
    await api('DELETE','receta_items?producto_id=eq.'+id);
    if(ok.length)await ins('receta_items',ok.map(l=>({producto_id:id,insumo_id:l.insumo_id,cantidad:num(l.cantidad),aplica:l.aplica,nota:(l.nota||'').trim()||null})));
    mo.close();toast('Producto guardado','ok');R.productos()})}

const UNI=['g','kg','ml','l','unidad','feta'];

async function itStock(){

    const mo=modal('<h2>Ajustar: '+esc(r.nombre)+'</h2><p class="hint" style="margin-bottom:10px">Stock actual en sistema: <b>'+fnum(r.stock,3)+' '+esc(r.unidad)+'</b>. Poné lo que contás en realidad.</p><div class="fgrid"><div class="fg"><label>Stock real ('+esc(r.unidad)+')</label><input id="an" type="number" step="any" inputmode="decimal" value="'+r.stock+'"></div><div class="fg"><label>Motivo</label><input id="am" placeholder="Ej: conteo del lunes"></div></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');

function editInsumo(r,provs){
  const mo=modal('<h2>'+(r?'Editar insumo':'Nuevo insumo')+'</h2><div class="fgrid"><div class="fg w2"><label>Nombre</label><input id="n" value="'+esc(r?.nombre||'')+'" placeholder="Ej: Pan de lomito"></div><div class="fg"><label>Tipo</label><select id="t"><option value="ingrediente">Ingrediente</option><option value="descartable"'+(r?.tipo==='descartable'?' selected':'')+'>Descartable</option></select></div><div class="fg"><label>Se mide en</label><select id="u">'+UNI.map(u=>'<option'+((r?.unidad||'g')===u?' selected':'')+'>'+u+'</option>').join('')+'</select></div><div class="fg"><label>Costo por unidad de medida</label><input id="c" type="number" step="any" inputmode="decimal" value="'+(r?.costo??'')+'"><span class="hint">Ej: si se mide en g, el costo de 1 g</span></div><div class="fg"><label>Stock mínimo</label><input id="m" type="number" step="any" inputmode="decimal" value="'+(r?.stock_min??0)+'"></div>'+(r?'':'<div class="fg"><label>Stock inicial</label><input id="s" type="number" step="any" inputmode="decimal" value="0"></div>')+'<div class="fg"><label>Proveedor</label><select id="p"><option value="">—</option>'+provs.map(p=>'<option value="'+p.id+'"'+(r?.proveedor_id===p.id?' selected':'')+'>'+esc(p.nombre)+'</option>').join('')+'</select></div>'+(r?'<div class="fg"><label>Activo</label><select id="a"><option value="true">Sí</option><option value="false"'+(!r.activo?' selected':'')+'>No</option></select></div>':'')+'</div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{
    const d={nombre:$('#n',mo).value.trim(),tipo:$('#t',mo).value,unidad:$('#u',mo).value,costo:num($('#c',mo).value),stock_min:num($('#m',mo).value),proveedor_id:$('#p',mo).value||null};
    if(!d.nombre)throw new Error('Falta el nombre');
    if(r){d.activo=$('#a',mo).value==='true';await upd('insumos',r.id,d)}
    else{const x=await ins('insumos',d);const s=num($('#s',mo).value);if(s>0)await rpc('ajustar_stock',{p_insumo:x[0].id,p_nuevo:s,p_motivo:'Stock inicial'})}
    mo.close();R.insumos()})}
function compraModal(insumos,provs,after){
  insumos=insumos.slice();provs=provs.slice();
  const FACT=u=>u==='g'?[['g',1],['kg',1000]]:u==='ml'?[['ml',1],['l',1000]]:[[u,1]];
  let lines=[{insumo_id:'',cantidad:'',costo_unit:'',cu:''}];
  const mo=modal('<h2>Registrar compra</h2><p class="hint" style="margin-bottom:10px">Cargá lo que compraste. Si lo comprás por kilo pero lo usás en gramos, elegí “kg” en cada línea: el sistema convierte solo.</p><div class="fgrid"><div class="fg"><label>Proveedor</label><div style="display:flex;gap:6px"><select id="cp" style="flex:1"><option value="">—</option></select><button class="btn sm l" id="np" type="button">+ Nuevo</button></div></div><div class="fg"><label>Comprobante</label><input id="cc"></div></div><div id="cl"></div><div class="brow"><button class="btn l sm" id="ca" type="button">+ Otra línea</button><button class="btn l sm" id="ni" type="button">+ Insumo nuevo</button></div><div class="fgrid" style="margin-top:12px"><div class="fg"><label>¿Pagada con plata de la caja?</label><select id="pc"><option value="false">No</option><option value="true">Sí, salió de la caja</option></select></div><div class="fg"><label>Medio</label><select id="pm"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option></select></div></div><div class="trow"><span>Total</span><b id="ct"></b></div><div class="mfoot"><button class="btn o" id="ok">Registrar</button></div>',{wide:true});
  const drawProv=sel=>{$('#cp',mo).innerHTML='<option value="">—</option>'+provs.map(p=>'<option value="'+p.id+'"'+(sel===p.id?' selected':'')+'>'+esc(p.nombre)+'</option>').join('')};
  drawProv();
  const draw=()=>{$('#cl',mo).innerHTML=lines.map((l,i)=>{const x=insumos.find(y=>y.id===l.insumo_id);const fs=FACT(x?x.unidad:'u');return '<div class="brow"><select class="ci" data-i="'+i+'" style="flex:2;min-width:170px"><option value="">— insumo —</option>'+insumos.map(y=>'<option value="'+y.id+'"'+(l.insumo_id===y.id?' selected':'')+'>'+esc(y.nombre)+' ('+esc(y.unidad)+')</option>').join('')+'</select><input class="cq" data-i="'+i+'" type="number" step="any" inputmode="decimal" placeholder="Cantidad" value="'+l.cantidad+'" style="flex:1;min-width:80px"><select class="cf" data-i="'+i+'" style="width:76px">'+fs.map(f=>'<option value="'+f[1]+'"'+(String(l.cu)===String(f[1])?' selected':'')+'>'+esc(f[0])+'</option>').join('')+'</select><input class="cu" data-i="'+i+'" type="number" step="any" inputmode="decimal" placeholder="Precio por '+esc(fs.find(f=>String(f[1])===String(l.cu||1))?.[0]||'unidad')+'" value="'+l.costo_unit+'" style="flex:1;min-width:100px">'+(lines.length>1?'<button class="btn sm l" data-d="'+i+'">✕</button>':'')+'</div>'}).join('');
    mo.querySelectorAll('.ci').forEach(s=>s.onchange=()=>{const l=lines[s.dataset.i];l.insumo_id=s.value;l.cu=1;const x=insumos.find(y=>y.id===s.value);if(x&&!l.costo_unit)l.costo_unit=x.costo;draw()});
    mo.querySelectorAll('.cq').forEach(s=>s.oninput=()=>{lines[s.dataset.i].cantidad=s.value;tot()});
    mo.querySelectorAll('.cf').forEach(s=>s.onchange=()=>{const l=lines[s.dataset.i];const x=insumos.find(y=>y.id===l.insumo_id);const antes=Number(l.cu||1),ahora=Number(s.value);l.cu=ahora;if(x&&num(l.costo_unit)>0)l.costo_unit=Math.round(num(l.costo_unit)*ahora/antes*10000)/10000;draw()});
    mo.querySelectorAll('.cu').forEach(s=>s.oninput=()=>{lines[s.dataset.i].costo_unit=s.value;tot()});
    mo.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.d,1);draw()});tot()};
  const tot=()=>{$('#ct',mo).textContent=money(lines.reduce((a,l)=>a+num(l.cantidad)*num(l.costo_unit),0))};
  $('#ca',mo).onclick=()=>{lines.push({insumo_id:'',cantidad:'',costo_unit:'',cu:''});draw()};
  $('#np',mo).onclick=()=>proveedorRapido(x=>{provs.push(x);drawProv(x.id)});
  $('#ni',mo).onclick=()=>insumoRapido(provs,x=>{insumos.push(x);const l=lines.find(z=>!z.insumo_id);if(l){l.insumo_id=x.id;l.cu=1;l.costo_unit=x.costo||''}else lines.push({insumo_id:x.id,cantidad:'',costo_unit:x.costo||'',cu:1});draw()});
  draw();
  $('#ok',mo).onclick=e=>busy(e.target,async()=>{const items=lines.filter(l=>l.insumo_id&&num(l.cantidad)>0).map(l=>{const f=Number(l.cu||1);return {insumo_id:l.insumo_id,cantidad:num(l.cantidad)*f,costo_unit:num(l.costo_unit)/f}});
    if(!items.length)throw new Error('Cargá al menos un insumo');
    await rpc('registrar_compra',{p_proveedor:$('#cp',mo).value||null,p_comprobante:$('#cc',mo).value||null,p_items:items,p_pagar_caja:$('#pc',mo).value==='true',p_medio:$('#pm',mo).value,p_notas:null});
    mo.close();toast('Compra registrada, stock actualizado','ok');if(after)after();else{IT.tab='stock';R.insumos()}})}

  '<div class="brow"><span class="badge b-bad">Últimos 100: '+money(tot)+' perdidos</span><span class="sp"></span><button class="btn o" id="dn">+ Registrar desperdicio</button></div>'+
  (rows.length?'<div class="twrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th class="n">Cant.</th><th>Motivo</th><th>Quién</th><th class="n">Costo</th></tr></thead><tbody>'+rows.map(r=>'<tr class="click" data-d="'+r.id+'"><td>'+fdt(r.created_at)+'</td><td><span class="badge '+(r.tipo==='completo'?'b-bad':'b-warn')+'">'+r.tipo+'</span></td><td>'+esc(r.producto_nombre||'(varios insumos)')+'</td><td class="n">'+(r.cantidad?fnum(r.cantidad,0):'')+'</td><td>'+esc(r.motivo||'')+'</td><td>'+esc(r.usuario_nombre||'')+'</td><td class="n">'+money(r.costo_total)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="panel vacio">No hay desperdicios registrados 👍</div>'));

R.caja=async function(){

    '<div class="brow"><button class="btn l" id="mi_">+ Ingreso</button><button class="btn l" id="me_">− Egreso</button><span class="sp"></span><button class="btn r" id="ct">Cerrar turno</button></div><div class="panel"><div class="ptit">Movimientos del turno</div>'+tabla(['Hora','Tipo','Concepto','Medio','Importe'],mv.map(m=>[fdt(m.fecha),m.tipo,m.concepto||'',MEDIOS[m.medio_pago]||m.medio_pago||'',(m.tipo==='egreso'?'−':'')+money(m.importe)]),[4])+'</div>'}
  h+='<div class="panel"><div class="ptit">Turnos anteriores</div>'+tabla(['Cajero','Apertura','Cierre','Esperado','Contado','Diferencia'],hist.map(x=>[x.usuario_nombre,'<!><a href="#" data-th="'+x.id+'">'+fdt(x.abierta_at)+'</a>',fdt(x.cerrada_at),money(x.efectivo_esperado),money(x.efectivo_contado),'<!><b class="'+(Math.abs(x.diferencia)<1?'pos':'neg2')+'">'+money(x.diferencia)+'</b>']),[3,4,5])+'</div>';
  main(h);
  $('#main').querySelectorAll('[data-th]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const x=hist.find(q=>q.id===a.dataset.th);if(x)resumenTurno(x,null,null,null)});
  if(!t){$('#ab').onclick=e=>busy(e.target,async()=>{await rpc('abrir_turno',{p_monto:num($('#mi').value)});toast('Turno abierto','ok');R.caja()})}
  else{
    const mov=tp=>{const mo=modal('<h2>'+(tp==='ingreso'?'Ingreso':'Egreso')+' de caja</h2><div class="fgrid"><div class="fg wf"><label>Concepto</label><input id="cc"></div><div class="fg"><label>Importe</label><input id="ci" type="number" inputmode="decimal"></div><div class="fg"><label>Medio</label><select id="cm"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option></select></div></div><div class="mfoot"><button class="btn o" id="ok">Guardar</button></div>');$('#ok',mo).onclick=e=>busy(e.target,async()=>{await rpc('caja_movimiento',{p_tipo:tp,p_concepto:$('#cc',mo).value,p_importe:num($('#ci',mo).value),p_medio:$('#cm',mo).value});mo.close();R.caja()})};
    $('#mi_').onclick=()=>mov('ingreso');$('#me_').onclick=()=>mov('egreso');
    $('#ct').onclick=()=>busy($('#ct'),async()=>{
      const mv=await get('caja_movimientos?select=*&turno_id=eq.'+t.id);
      const vs=await get('ventas?select=total&estado=eq.confirmada&turno_id=eq.'+t.id);
      const vt=vs.reduce((a,v)=>a+Number(v.total),0);
      const netos={};mv.forEach(m=>{netos[m.medio_pago]=(netos[m.medio_pago]||0)+(m.tipo==='ingreso'?1:-1)*Number(m.importe)});
      const esp={};Object.keys(MEDIOS).forEach(k=>esp[k]=(netos[k]||0)+(k==='efectivo'?Number(t.monto_inicial):0));

      const mo=modal('<h2>Cerrar turno</h2><div class="sgrid" style="margin-bottom:10px"><div class="scard"><div class="slbl">Ventas del turno</div><div class="snum">'+vs.length+'</div></div><div class="scard"><div class="slbl">Total vendido</div><div class="snum">'+money(vt)+'</div></div><div class="scard"><div class="slbl">Efectivo inicial</div><div class="snum">'+money(t.monto_inicial)+'</div></div></div><p class="hint" style="margin-bottom:8px">Contá lo que hay realmente por cada medio de pago (efectivo en caja, comprobantes de tarjeta, transferencias recibidas). El sistema te muestra la diferencia con lo que esperaba. Lo que no uses, dejalo vacío.</p><div style="overflow-x:auto"><table><thead><tr><th>Medio</th><th class="n">Sistema espera</th><th class="n">Contado real</th><th class="n">Diferencia</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td><b>Total</b></td><td class="n"><b>'+money(Object.values(esp).reduce((a,x)=>a+x,0))+'</b></td><td class="n"><b id="tc">—</b></td><td class="n"><b id="td">—</b></td></tr></tfoot></table></div><div class="fg wf" style="margin-top:10px"><label>Notas</label><input id="nt"></div><div class="mfoot"><button class="btn r" id="ok">Cerrar turno</button></div>',{wide:true});
      const dif=(k,v)=>{const d=v-esp[k];return '<b class="'+(Math.abs(d)<1?'pos':'neg2')+'">'+(d>0?'+':'')+money(d)+'</b>'};
      const calc=()=>{let tc=0,td=0,any=false;mo.querySelectorAll('.cc').forEach(i=>{const k=i.dataset.k,c=mo.querySelector('[data-d="'+k+'"]');if(i.value===''){c.innerHTML='—';return}any=true;const v=num(i.value);tc+=v;td+=v-esp[k];c.innerHTML=dif(k,v)});mo.querySelector('#tc').textContent=any?money(tc):'—';mo.querySelector('#td').innerHTML=any?'<span class="'+(Math.abs(td)<1?'pos':'neg2')+'">'+(td>0?'+':'')+money(td)+'</span>':'—'};
      mo.querySelectorAll('.cc').forEach(i=>i.oninput=calc);
      $('#ok',mo).onclick=e=>busy(e.target,async()=>{
        const ef=mo.querySelector('.cc[data-k="efectivo"]').value;
        if(ef==='')throw new Error('Poné el efectivo contado en caja (si no hay nada, poné 0)');
        const cs={};mo.querySelectorAll('.cc').forEach(i=>{if(i.dataset.k!=='efectivo'&&i.value!=='')cs[i.dataset.k]=num(i.value)});
        const hayDif=Object.keys(MEDIOS).some(k=>{const v=k==='efectivo'?num(ef):(k in cs?cs[k]:null);return v!==null&&Math.abs(v-esp[k])>=1});
        if(hayDif){const ok=await ask('Hay diferencias entre lo que espera el sistema y lo que contaste. ¿Cerrar el turno igual?','Sí, cerrar',true);if(!ok)return}
        const r=await rpc('cerrar_turno',{p_contado:num(ef),p_notas:$('#nt',mo).value||null,p_contados:cs});
        mo.close();toast('Turno cerrado','ok');
        resumenTurno({...t,cerrada_at:new Date().toISOString(),notas:$('#nt',mo).value||null,resumen:r.resumen,efectivo_esperado:r.efectivo_esperado,efectivo_contado:r.efectivo_contado,diferencia:r.diferencia},vt,vs.length,()=>R.caja());
      });
    })}};
function resumenTurno(x,vt,nv,fin){
  const rs=x.resumen||{},e=rs.esperado||{},c=rs.contados||{},d=rs.diferencias||{};
  const rows=Object.keys(MEDIOS).filter(k=>k in e||k in c).map(k=>'<tr><td>'+MEDIOS[k]+'</td><td class="n">'+money(e[k]||0)+'</td><td class="n">'+(k in c?money(c[k]):'—')+'</td><td class="n">'+(k in d?'<b class="'+(Math.abs(d[k])<1?'pos':'neg2')+'">'+(d[k]>0?'+':'')+money(d[k])+'</b>':'—')+'</td></tr>').join('');
  const mo=modal('<h2>Resumen del turno</h2><p class="hint" style="margin-bottom:8px">'+esc(x.usuario_nombre||'')+' · '+fdt(x.abierta_at)+' → '+fdt(x.cerrada_at)+'<br>Efectivo inicial: '+money(x.monto_inicial)+(nv!=null?' · Ventas: '+nv+' por '+money(vt):(rs.ventas!=null?' · Ventas: '+rs.ventas:''))+'</p><div style="overflow-x:auto"><table><thead><tr><th>Medio</th><th class="n">Sistema esperaba</th><th class="n">Contado</th><th class="n">Diferencia</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">Este turno se cerró antes del detalle por medio. Efectivo esperado '+money(x.efectivo_esperado)+', contado '+money(x.efectivo_contado)+'.</td></tr>')+'</tbody></table></div>'+(x.notas?'<p style="margin-top:8px"><b>Notas:</b> '+esc(x.notas)+'</p>':'')+'<div class="mfoot"><button class="btn l" id="pr">🖨️ Imprimir</button><button class="btn o" id="ok">Listo</button></div>',{wide:true});
  $('#ok',mo).onclick=()=>{mo.close();if(fin)fin()};
  $('#pr',mo).onclick=()=>{const w=window.open('','_blank','width=420,height=640');if(!w)return toast('Permití ventanas emergentes para imprimir','err');w.document.write('<html><body style="font-family:monospace;font-size:13px;padding:10px"><h3>Cierre de turno</h3>'+mo.querySelector('.modal').innerHTML.replace(/<button[\s\S]*?<\/button>/g,'')+'</body></html>');w.document.close();w.print()};
}

/* ---------- VENTAS ---------- */
let VT={desde:'',hasta:'',tab:'nueva'},VC={items:[],cat:'',q:''};
function ventasTabs(){return '<div class="tabs2"><button data-vt="nueva" class="'+(VT.tab==='nueva'?'act':'')+'">🧾 Nueva venta</button><button data-vt="hist" class="'+(VT.tab==='hist'?'act':'')+'">📋 Ventas cobradas</button></div>'}
function ventasTabsBind(){document.querySelectorAll('#main [data-vt]').forEach(b=>b.onclick=()=>{VT.tab=b.dataset.vt;R.ventas()})}
R.ventas=async function(){return VT.tab==='hist'?ventasHist():ventaNueva()};
async function ventaNueva(){
  const cat=await catalogos();
  const draw=()=>{
    const prods=cat.prods.filter(p=>(!VC.cat||p.categoria_id===VC.cat)&&(!VC.q||p.nombre.toLowerCase().includes(VC.q.toLowerCase())));
    const tot=VC.items.reduce((a,i)=>a+i.cantidad*i.precio,0);
    main(ventasTabs()+ayuda('Cómo se hace una venta','<ol><li>Tocá los <b>productos</b> que pide el cliente. Con <b>📝 Con/Sin</b> indicás lo que no lleva (sin tomate…) o los extras.</li><li>Tocá <b>Enviar a cocina</b> o <b>Cobrar</b>. Se abre una ventana para elegir cómo es el pedido: <b>Comer acá</b> (mesa), <b>Mostrador</b>, <b>Retira el cliente</b> o <b>Delivery</b>.</li><li>En el último paso decidís si <b>cobrás ahora</b> (elegís el medio de pago) o <b>después</b> (queda abierto en <b>Pedidos</b>).</li></ol>')+
    '<div class="cmd"><div><div class="chips"><button class="chip'+(!VC.cat?' act':'')+'" data-vk="">Todos</button>'+cat.cats.map(k=>'<button class="chip'+(VC.cat===k.id?' act':'')+'" data-vk="'+k.id+'">'+esc(k.nombre)+'</button>').join('')+'</div><div class="srch" style="margin-bottom:10px;max-width:none"><span>🔍</span><input id="vq" placeholder="Buscar producto" value="'+esc(VC.q)+'"></div><div class="pgrid">'+(prods.map(p=>'<button class="prod'+(p.disponible?'':' off')+'" data-vp="'+p.id+'"><span class="pn">'+esc(p.nombre)+'</span><span class="pp">'+money(p.precio)+'</span>'+(p.disponible?'':'<span class="hint">No disponible</span>')+'</button>').join('')||'<div class="vacio">Sin productos</div>')+'</div></div>'+
    '<div class="ticket"><div class="ptit" style="font-size:20px">Pedido</div><div class="citems">'+(VC.items.map((i,k)=>'<div class="cit"><div class="nm">'+fnum(i.cantidad,0)+' × '+esc(i.nombre)+'</div><div class="n">'+money(i.cantidad*i.precio)+'</div><div class="ctl"><button class="btn sm l" data-vm="'+k+'">−</button><button class="btn sm l" data-va="'+k+'">+</button><button class="btn sm l" data-vn="'+k+'">📝 Con/Sin</button><button class="btn sm l" data-vx="'+k+'">✕</button>'+(i.notas?'<span class="hint" style="color:#b91c1c;font-weight:700">'+esc(i.notas)+'</span>':'')+'</div></div>').join('')||'<div class="vacio">Tocá los productos para armar el pedido</div>')+'</div><div class="ttl"><span>Total</span><span>'+money(tot)+'</span></div><div class="brow" style="margin-top:12px"><button class="btn y big" id="vk"'+(VC.items.length?'':' disabled')+'>🍳 Enviar a cocina</button><button class="btn g big" id="vc"'+(VC.items.length?'':' disabled')+'>💵 Cobrar</button>'+(VC.items.length?'<button class="btn l sm" id="vv">Vaciar</button>':'')+'</div></div></div>');
    ventasTabsBind();
    const M=$('#main');
    M.querySelectorAll('[data-vk]').forEach(b=>b.onclick=()=>{VC.cat=b.dataset.vk;draw()});
    const q=$('#vq');q.oninput=e=>{VC.q=e.target.value;clearTimeout(q._t);q._t=setTimeout(()=>{draw();const n=$('#vq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},300)};
    M.querySelectorAll('[data-vp]').forEach(b=>b.onclick=()=>{const p=cat.prods.find(x=>x.id===b.dataset.vp);if(!p.disponible)return toast('Producto no disponible','err');const ex=VC.items.find(i=>i.producto_id===p.id&&!i.notas);if(ex)ex.cantidad++;else VC.items.push({producto_id:p.id,nombre:p.nombre,precio:Number(p.precio),cantidad:1,notas:null});draw()});
    M.querySelectorAll('[data-va]').forEach(b=>b.onclick=()=>{VC.items[+b.dataset.va].cantidad++;draw()});
    M.querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{const i=VC.items[+b.dataset.vm];if(i.cantidad>1)i.cantidad--;else VC.items.splice(+b.dataset.vm,1);draw()});

    if($('#vv'))$('#vv').onclick=()=>{VC.items=[];draw()};
    if($('#vc'))$('#vc').onclick=()=>finalizarVenta('cobrar');
    if($('#vk'))$('#vk').onclick=()=>finalizarVenta('cocina')};
  draw()}
function finalizarVenta(pref){
  let modo=null,mesa=null;
  const tot=VC.items.reduce((a,i)=>a+i.cantidad*i.precio,0);
  const prim=n=>(pref==='cobrar'?n==='now':n==='later')?'o':'l';
  const mo=modal('<h2>¿Cómo es el pedido? · '+money(tot)+'</h2><div class="seg" id="tpb">'+Object.keys(MODOS).map(k=>'<button type="button" data-tp="'+k+'" style="font-size:15px;padding:14px 6px">'+MODOS[k]+'</button>').join('')+'</div><div id="tpf"></div><label style="display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-weight:700"><input type="checkbox" id="kc" checked style="width:20px;height:20px"> 🍳 Enviar a cocina (destildalo si no hay nada para preparar, ej: una bebida)</label><div class="hint" style="margin:10px 0 4px">Último paso: ¿cobrás ahora?</div><div class="mfoot"><button class="btn '+prim('later')+' big" id="ok-later" disabled>⏳ Cobrar después</button><button class="btn '+prim('now')+' big" id="ok-now" disabled>💵 Cobrar ahora</button></div>',{wide:true});
  const hab=v=>{$('#ok-now',mo).disabled=!v;$('#ok-later',mo).disabled=!v};
  mo.querySelectorAll('[data-tp]').forEach(b=>b.onclick=async()=>{modo=b.dataset.tp;mesa=null;
    mo.querySelectorAll('[data-tp]').forEach(x=>x.classList.toggle('act',x===b));hab(modo!=='salon');
    const f=$('#tpf',mo);
    if(modo==='salon'){f.innerHTML='<div class="vacio">Cargando mapa…</div>';
      const [ms,cat]=await Promise.all([get('mesas_estado?select=*&activa=eq.true&order=numero'),catalogos(true)]);
      if(modo!=='salon')return;
      f.innerHTML='<div class="hint" style="margin:6px 0">Tocá la mesa donde se sienta (las naranjas están ocupadas)</div><div id="mpk"></div><div class="fg" style="max-width:160px"><label>¿Cuántos son?</label><input id="cu" type="number" min="1" value="2" inputmode="numeric"></div>';
      mesaPicker($('#mpk',mo),ms,cat.zonas,{sel:null,zona:SAL.zona,onSel:id=>{mesa=id;hab(true)}})}
    else f.innerHTML='<div class="fgrid" style="margin-top:8px"><div class="fg"><label>Nombre'+(modo==='mostrador'?' (opcional)':'')+'</label><input id="nn"></div>'+(modo==='delivery'?'<div class="fg"><label>Teléfono</label><input id="nt" inputmode="tel"></div><div class="fg wf"><label>Dirección de entrega</label><input id="nd"></div>':'')+'</div>'});
  const crear=async(ahora,btn)=>busy(btn,async()=>{
    if(!modo)throw new Error('Elegí cómo es el pedido');
    let args;
    if(modo==='salon'){if(!mesa)throw new Error('Elegí la mesa');args={p_modo:'salon',p_mesa:mesa,p_cubiertos:parseInt($('#cu',mo).value)||1}}
    else{const nn=$('#nn',mo).value.trim();if(modo==='llevar'&&!nn)throw new Error('Poné el nombre de quien retira');if(modo==='delivery'&&!$('#nd',mo).value.trim())throw new Error('Poné la dirección de entrega');
      args={p_modo:modo,p_cliente_nombre:nn||null,p_telefono:modo==='delivery'?$('#nt',mo).value.trim()||null:null,p_direccion:modo==='delivery'?$('#nd',mo).value.trim()||null:null}}
    const aCocina=$('#kc',mo).checked;
    const id=await rpc('abrir_comanda',args);
    const llevar=modo==='llevar'||modo==='delivery';
    try{await ins('comanda_items',VC.items.map(i=>({comanda_id:id,producto_id:i.producto_id,cantidad:i.cantidad,llevar,notas:i.notas||null})));
      if(aCocina)await rpc('enviar_a_cocina',{p_comanda:id})}
    catch(er){try{await rpc('anular_comanda',{p_comanda:id,p_motivo:'Error al cargar los productos'})}catch(x){}throw er}
    VC.items=[];VC.q='';mo.close();
    if(ahora){toast(aCocina?'Enviado a cocina. Ahora el cobro':'Pedido creado. Ahora el cobro','ok');cobrarModal({id},tot,()=>{},()=>go('ventas'));VT.tab='nueva'}
    else{toast((aCocina?'Enviado a cocina. ':'')+'Queda abierto para cobrar después (lo ves en Pedidos)','ok');go('pedidos')}});
  $('#ok-now',mo).onclick=e=>crear(true,e.target);
  $('#ok-later',mo).onclick=e=>crear(false,e.target)}
